name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.2.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.0 or v1.2.0-beta.1"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Apply version
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
          node -e "const f='extension/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.version='${{ steps.version.outputs.value }}'.split('-')[0];fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      - run: npm run typecheck

      - run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Zip browser extension
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath "dist/FiveM-Portal-Push-Connector-${{ steps.version.outputs.value }}.zip"

      - name: Upload to release
        shell: bash
        run: |
          gh release upload "$TAG" \
            dist/FiveM-Portal-Push-Setup-*.exe \
            dist/FiveM-Portal-Push-*-portable.exe \
            dist/FiveM-Portal-Push-Connector-*.zip \
            --clobber
