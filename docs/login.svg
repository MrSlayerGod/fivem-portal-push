<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <rect width="1280" height="560" rx="24" fill="#0b0b0c"/>
  <text x="40" y="56" fill="#ffffff" font-size="24" font-weight="700">How "Log in with browser" works</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#36ff9f"/>
    </marker>
  </defs>

  <g font-size="17" font-weight="700" text-anchor="middle">
    <rect x="70" y="84" width="260" height="56" rx="14" fill="#1c1c1e"/>
    <text x="200" y="118" fill="#fff">FiveM Portal Push</text>
    <rect x="510" y="84" width="260" height="56" rx="14" fill="#1c1c1e"/>
    <text x="640" y="118" fill="#fff">Your browser + extension</text>
    <rect x="950" y="84" width="260" height="56" rx="14" fill="#1c1c1e"/>
    <text x="1080" y="118" fill="#fff">Cfx.re forum + portal</text>
  </g>

  <g stroke="#3a3a3d" stroke-width="2" stroke-dasharray="4 6">
    <line x1="200" y1="140" x2="200" y2="500"/>
    <line x1="640" y1="140" x2="640" y2="500"/>
    <line x1="1080" y1="140" x2="1080" y2="500"/>
  </g>

  <g stroke="#36ff9f" stroke-width="2.5" marker-end="url(#a)">
    <line x1="200" y1="190" x2="1074" y2="190"/>
    <line x1="200" y1="248" x2="634" y2="248"/>
    <line x1="640" y1="306" x2="1074" y2="306"/>
    <line x1="1080" y1="364" x2="646" y2="364"/>
    <line x1="640" y1="422" x2="206" y2="422"/>
    <line x1="200" y1="480" x2="1074" y2="480"/>
  </g>

  <g font-size="15" fill="#e8e9eb">
    <text x="216" y="180"><tspan fill="#36ff9f" font-weight="700">1 </tspan>The app asks the portal for a login link, in its own session</text>
    <text x="216" y="238"><tspan fill="#36ff9f" font-weight="700">2 </tspan>Opens that link in your browser</text>
    <text x="656" y="296"><tspan fill="#36ff9f" font-weight="700">3 </tspan>You are already logged in on the forum</text>
    <text x="656" y="354"><tspan fill="#36ff9f" font-weight="700">4 </tspan>The forum sends a one-time sso + sig code</text>
    <text x="216" y="412"><tspan fill="#36ff9f" font-weight="700">5 </tspan>The extension catches the code and closes the tab</text>
    <text x="216" y="470"><tspan fill="#36ff9f" font-weight="700">6 </tspan>The app finishes the login and gets its own portal session</text>
  </g>

  <text x="40" y="536" fill="#a1a1a8" font-size="15">No browser cookies are copied. Your browser keeps its own forum and portal sessions.</text>
</svg>
