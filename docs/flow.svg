<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 310" width="1480" height="310" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <rect width="1480" height="310" rx="24" fill="#0b0b0c"/>
  <text x="40" y="56" fill="#ffffff" font-size="24" font-weight="700">What happens when you press Push</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#36ff9f"/>
    </marker>
  </defs>

  <g font-size="14" fill="#a1a1a8">
    <rect x="20" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <circle cx="48" cy="124" r="16" fill="#36ff9f"/><text x="48" y="129" fill="#333" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="40" y="178" fill="#fff" font-size="18" font-weight="700">Pick a script</text>
    <text x="40" y="206">The portal asset is</text><text x="40" y="226">remembered for each</text><text x="40" y="246">resource name</text>

    <rect x="230" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <circle cx="258" cy="124" r="16" fill="#36ff9f"/><text x="258" y="129" fill="#333" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="250" y="178" fill="#fff" font-size="18" font-weight="700">Bump version</text>
    <text x="250" y="206">Writes the version</text><text x="250" y="226">into fxmanifest.lua,</text><text x="250" y="246">-b1 marks a beta</text>

    <rect x="440" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <circle cx="468" cy="124" r="16" fill="#36ff9f"/><text x="468" y="129" fill="#333" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="460" y="178" fill="#fff" font-size="18" font-weight="700">Zip</text>
    <text x="460" y="206">Skips .git, editor</text><text x="460" y="226">folders and your</text><text x="460" y="246">rules, adds extras</text>

    <rect x="650" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <circle cx="678" cy="124" r="16" fill="#36ff9f"/><text x="678" y="129" fill="#333" font-size="15" font-weight="700" text-anchor="middle">4</text>
    <text x="670" y="178" fill="#fff" font-size="18" font-weight="700">Free a slot</text>
    <text x="670" y="206">The portal keeps 5</text><text x="670" y="226">versions, the oldest</text><text x="670" y="246">one is removed</text>

    <rect x="860" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <circle cx="888" cy="124" r="16" fill="#36ff9f"/><text x="888" y="129" fill="#333" font-size="15" font-weight="700" text-anchor="middle">5</text>
    <text x="880" y="178" fill="#fff" font-size="18" font-weight="700">Upload</text>
    <text x="880" y="206">2 MB chunks, then</text><text x="880" y="226">waits until the</text><text x="880" y="246">version is active</text>

    <rect x="1070" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <rect x="1070.5" y="90.5" width="179" height="179" rx="15.5" fill="none" stroke="#3a3a3d" stroke-dasharray="6 6"/>
    <circle cx="1098" cy="124" r="16" fill="#2c2c2e"/><text x="1098" y="129" fill="#e8e9eb" font-size="15" font-weight="700" text-anchor="middle">6</text>
    <text x="1090" y="178" fill="#fff" font-size="18" font-weight="700">Update post</text>
    <text x="1090" y="206">Optional: notes to</text><text x="1090" y="226">your site API and</text><text x="1090" y="246">Discord</text>

    <rect x="1280" y="90" width="180" height="180" rx="16" fill="#1c1c1e"/>
    <rect x="1280.5" y="90.5" width="179" height="179" rx="15.5" fill="none" stroke="#3a3a3d" stroke-dasharray="6 6"/>
    <circle cx="1308" cy="124" r="16" fill="#2c2c2e"/><text x="1308" y="129" fill="#e8e9eb" font-size="15" font-weight="700" text-anchor="middle">7</text>
    <text x="1300" y="178" fill="#fff" font-size="18" font-weight="700">GitHub</text>
    <text x="1300" y="206">Optional: commits</text><text x="1300" y="226">only this folder and</text><text x="1300" y="246">pushes the branch</text>
  </g>

  <g stroke="#36ff9f" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="204" y1="180" x2="224" y2="180"/>
    <line x1="414" y1="180" x2="434" y2="180"/>
    <line x1="624" y1="180" x2="644" y2="180"/>
    <line x1="834" y1="180" x2="854" y2="180"/>
    <line x1="1044" y1="180" x2="1064" y2="180"/>
    <line x1="1254" y1="180" x2="1274" y2="180"/>
  </g>
</svg>
